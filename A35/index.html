<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>HS Veículos</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f5f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 420px;
      background: #ffffff;
      padding: 35px 25px;
      border-radius: 18px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);
      text-align: center;
    }

    h1 {
      font-size: 28px;
      margin-bottom: 30px;
      color: #222222;
    }

    .botao {
      display: block;
      width: 100%;
      text-decoration: none;
      padding: 17px 15px;
      margin-bottom: 15px;
      border-radius: 12px;
      font-size: 18px;
      font-weight: bold;
      transition: 0.2s;
    }

    .botao:active {
      transform: scale(0.98);
    }

    .whatsapp {
      background: #25D366;
      color: #ffffff;
    }

    .instagram {
      background: #E1306C;
      color: #ffffff;
    }

    .google {
      background: #4285F4;
      color: #ffffff;
    }

    footer {
      margin-top: 28px;
      font-size: 14px;
      color: #777777;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>HS Veículos</h1>

    <a
      class="botao whatsapp"
      href="https://wa.me/5531995682300"
      target="_blank"
      rel="noopener noreferrer">
      💬 WhatsApp
    </a>

    <a
      class="botao instagram"
      href="https://www.instagram.com/hsveiculos?stkn=bms3eDBlbnUwY3dw"
      target="_blank"
      rel="noopener noreferrer">
      📸 Instagram
    </a>

    <a
      class="botao google"
      href="https://search.google.com/local/writereview?placeid=ChIJKTfzF4NjqAARs2yDC2kLsPM"
      target="_blank"
      rel="noopener noreferrer">
      ⭐ Avalie no Google
    </a>

    <footer>
      NFC Conecta Brasil
    </footer>

  </div>

</body>
</html>
