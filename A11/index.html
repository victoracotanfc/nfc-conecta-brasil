<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>HS Veículos</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background: #ffffff;
      width: 100%;
      max-width: 420px;
      padding: 35px 25px;
      border-radius: 18px;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.12);
      text-align: center;
    }

    h1 {
      font-size: 28px;
      margin-bottom: 30px;
      color: #222222;
    }

    .button {
      display: block;
      width: 100%;
      padding: 16px;
      margin: 14px 0;
      border-radius: 12px;
      text-decoration: none;
      color: #ffffff;
      font-size: 18px;
      font-weight: bold;
      transition: 0.2s;
    }

    .button:hover {
      transform: scale(1.02);
      opacity: 0.9;
    }

    .whatsapp {
      background: #25D366;
    }

    .instagram {
      background: #E1306C;
    }

    .google {
      background: #4285F4;
    }

    .footer {
      margin-top: 25px;
      font-size: 13px;
      color: #888888;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>HS Veículos</h1>

    <a
      class="button whatsapp"
      href="https://wa.me/5531991952858"
      target="_blank"
      rel="noopener noreferrer"
    >
      WhatsApp
    </a>

    <a
      class="button instagram"
      href="https://www.instagram.com/hsveiculos.curvelo"
      target="_blank"
      rel="noopener noreferrer"
    >
      Instagram
    </a>

    <a
      class="button google"
      href="https://share.google/vVjUkNr28aMVmAfus"
      target="_blank"
      rel="noopener noreferrer"
    >
      Avalie no Google
    </a>

    <div class="footer">
      NFC Conecta Brasil
    </div>

  </div>

</body>
</html>
