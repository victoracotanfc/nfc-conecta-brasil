<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dubom Açaí</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, Helvetica, sans-serif;
      background-color: #f5f5f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 420px;
      background-color: #ffffff;
      border-radius: 18px;
      padding: 32px 22px;
      text-align: center;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.10);
    }

    h1 {
      margin: 0 0 10px;
      color: #222222;
      font-size: 28px;
    }

    .subtitulo {
      color: #666666;
      font-size: 15px;
      margin-bottom: 28px;
    }

    .botao {
      display: block;
      width: 100%;
      padding: 17px;
      margin: 14px 0;
      border-radius: 14px;
      text-decoration: none;
      color: #ffffff;
      font-size: 17px;
      font-weight: bold;
      transition: transform 0.2s ease, opacity 0.2s ease;
    }

    .botao:hover {
      opacity: 0.92;
      transform: translateY(-2px);
    }

    .botao:active {
      transform: scale(0.98);
    }

    .whatsapp {
      background-color: #25D366;
    }

    .instagram {
      background: linear-gradient(
        45deg,
        #f09433,
        #e6683c,
        #dc2743,
        #cc2366,
        #bc1888
      );
    }

    .google {
      background-color: #4285F4;
    }

    footer {
      margin-top: 28px;
      color: #999999;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>Dubom Açaí</h1>

    <div class="subtitulo">
      Escolha uma opção abaixo
    </div>

    <a
      class="botao whatsapp"
      href="https://wa.me/5531999071012"
      target="_blank"
      rel="noopener noreferrer"
    >
      💬 WhatsApp
    </a>

    <a
      class="botao instagram"
      href="https://www.instagram.com/dubombubble?stkn=MWo5bHRhNHVjeXM0ZQ=="
      target="_blank"
      rel="noopener noreferrer"
    >
      📸 Instagram
    </a>

    <a
      class="botao google"
      href="https://search.google.com/local/writereview?placeid=ChIJrVOOaju1pwARVuWzzE-Hj7M"
      target="_blank"
      rel="noopener noreferrer"
    >
      ⭐ Avalie no Google
    </a>

    <footer>
      NFC Conecta Brasil
    </footer>

  </div>

</body>
</html>
