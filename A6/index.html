<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>IHF Store</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f5f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 420px;
      background: #ffffff;
      border-radius: 20px;
      padding: 35px 25px;
      text-align: center;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);
    }

    h1 {
      font-size: 28px;
      color: #222222;
      margin-bottom: 30px;
    }

    .botao {
      display: block;
      width: 100%;
      padding: 17px;
      margin-bottom: 15px;
      border-radius: 12px;
      text-decoration: none;
      color: #ffffff;
      font-size: 18px;
      font-weight: bold;
      transition: 0.2s;
    }

    .botao:active {
      transform: scale(0.98);
    }

    .whatsapp {
      background: #25D366;
    }

    .instagram {
      background: #E1306C;
    }

    .google {
      background: #4285F4;
    }

    footer {
      margin-top: 30px;
      font-size: 14px;
      color: #888888;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>IHF Store</h1>

    <a
      class="botao whatsapp"
      href="https://wa.me/5531997524562"
      target="_blank"
      rel="noopener noreferrer"
    >
      💬 WhatsApp
    </a>

    <a
      class="botao instagram"
      href="https://www.instagram.com/ihfstore_?stkn=MTZyc2dpOWN0cDBmMA=="
      target="_blank"
      rel="noopener noreferrer"
    >
      📸 Instagram
    </a>

    <a
      class="botao google"
      href="https://maps.app.goo.gl/Gno2iqHz6acFjYF66?g_st=ic"
      target="_blank"
      rel="noopener noreferrer"
    >
      ⭐ Avalie no Google
    </a>

    <footer>
      NFC Conecta Brasil
    </footer>

  </div>

</body>
</html>
