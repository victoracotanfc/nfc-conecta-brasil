<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SPACE BIKE</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background-color: #f5f5f5;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 420px;
      background-color: #ffffff;
      border-radius: 18px;
      padding: 32px 22px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.10);
      text-align: center;
    }

    h1 {
      font-size: 26px;
      color: #222222;
      margin-bottom: 10px;
    }

    .subtitle {
      color: #777777;
      font-size: 15px;
      margin-bottom: 28px;
    }

    .button {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      text-decoration: none;
      padding: 16px;
      margin-bottom: 14px;
      border-radius: 12px;
      font-size: 17px;
      font-weight: bold;
      color: #ffffff;
      transition: transform 0.2s ease, opacity 0.2s ease;
    }

    .button:active {
      transform: scale(0.98);
    }

    .button:hover {
      opacity: 0.9;
    }

    .whatsapp {
      background-color: #25D366;
    }

    .instagram {
      background: linear-gradient(
        45deg,
        #f09433,
        #e6683c,
        #dc2743,
        #cc2366,
        #bc1888
      );
    }

    .google {
      background-color: #4285F4;
    }

    .emoji {
      margin-right: 9px;
      font-size: 21px;
    }

    .footer {
      margin-top: 24px;
      color: #aaaaaa;
      font-size: 12px;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>SPACE BIKE</h1>

    <p class="subtitle">
      Escolha uma opção abaixo
    </p>

    <a
      class="button whatsapp"
      href="https://wa.me/5531989204640"
      target="_blank"
      rel="noopener noreferrer"
    >
      <span class="emoji">💬</span>
      WhatsApp
    </a>

    <a
      class="button instagram"
      href="https://www.instagram.com/Space_bike7l/"
      target="_blank"
      rel="noopener noreferrer"
    >
      <span class="emoji">📸</span>
      Instagram
    </a>

    <a
      class="button google"
      href="https://maps.app.goo.gl/7FTo4TVzUy7MZPjE9?g_st=ic"
      target="_blank"
      rel="noopener noreferrer"
    >
      <span class="emoji">⭐</span>
      Avalie no Google
    </a>

    <div class="footer">
      NFC Conecta Brasil
    </div>

  </div>

</body>
</html>
