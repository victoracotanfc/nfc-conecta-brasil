<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Space Bike</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: white;
      border-radius: 24px;
      padding: 30px 20px;
      text-align: center;
      box-shadow: 0 8px 30px rgba(0,0,0,0.12);
    }

    h1 {
      margin-bottom: 8px;
      font-size: 30px;
    }

    p {
      color: #666;
      margin-bottom: 28px;
    }

    .button {
      display: block;
      text-decoration: none;
      color: white;
      padding: 17px;
      margin: 14px 0;
      border-radius: 14px;
      font-size: 18px;
      font-weight: bold;
    }

    .google {
      background: #4285f4;
    }

    .whatsapp {
      background: #25d366;
    }

    .instagram {
      background: #e1306c;
    }

    .footer {
      margin-top: 25px;
      font-size: 13px;
      color: #999;
    }
  </style>
</head>

<body>

  <div class="card">

    <h1>Space Bike</h1>

    <p>Escolha uma opção abaixo</p>

    <a class="button google"
       href="https://share.google/WyGCrrDmw5MXt4WVr">
       ⭐ Avalie-nos no Google
    </a>

    <a class="button whatsapp"
       href="https://wa.me/5531994478187">
       💬 Fale conosco no WhatsApp
    </a>

    <a class="button instagram"
       href="https://instagram.com/space_bike7l">
       📸 Siga nosso Instagram
    </a>

    <div class="footer">
      NFC Conecta Brasil
    </div>

  </div>

</body>
</html>
