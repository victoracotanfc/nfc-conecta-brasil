<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NFC Conecta Brasil</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      text-align: center;
      padding: 30px 20px;
    }

    .container {
      max-width: 420px;
      margin: auto;
    }

    h1 {
      margin-bottom: 30px;
    }

    .botao {
      display: block;
      text-decoration: none;
      color: white;
      background: #222;
      padding: 18px;
      margin: 15px 0;
      border-radius: 12px;
      font-size: 18px;
    }

    .erro {
      color: #ff7070;
      margin-top: 40px;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1 id="nomeEmpresa">Carregando...</h1>

    <div id="botoes"></div>

    <p id="erro" class="erro"></p>
  </div>

  <script src="clientes.js"></script>

  <script>
    const parametros = new URLSearchParams(window.location.search);
    const id = parametros.get("id");

    const nomeEmpresa = document.getElementById("nomeEmpresa");
    const botoes = document.getElementById("botoes");
    const erro = document.getElementById("erro");

    if (id && clientes[id]) {
      const cliente = clientes[id];

      nomeEmpresa.textContent = cliente.nome;

      if (cliente.whatsapp) {
        botoes.innerHTML += `
          <a class="botao" href="${cliente.whatsapp}">
            WhatsApp
          </a>
        `;
      }

      if (cliente.instagram) {
        botoes.innerHTML += `
          <a class="botao" href="${cliente.instagram}">
            Instagram
          </a>
        `;
      }

      if (cliente.google) {
        botoes.innerHTML += `
          <a class="botao" href="${cliente.google}">
            Avalie no Google
          </a>
        `;
      }

    } else {
      nomeEmpresa.textContent = "NFC Conecta Brasil";
      erro.textContent = "Cliente não encontrado.";
    }
  </script>

</body>
</html>
