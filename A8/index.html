<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Restaurante Cheff’s</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f5f5;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 420px;

      border-radius: 18px;

      text-align: center;
    }

    h1 {
      margin: 0 0 30px;
      font-size: 26px;
      color: #222222;
    }

    .botao {
      display: block;
      width: 100%;
      padding: 16px 15px;
      margin: 14px 0;
      border-radius: 12px;
      text-decoration: none;
      color: #ffffff;
      font-size: 18px;
      font-weight: bold;
      transition: transform 0.2s ease, opacity 0.2s ease;
    }

    .botao:active {
      transform: scale(0.97);
    }

    .whatsapp {
      background: #25D366;
    }

    .instagram {
      background: #E1306C;
    }

    .google {
      background: #4285F4;
    }

    footer {
      margin-top: 30px;
      font-size: 14px;
      color: #777777;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>Restaurante Cheff’s</h1>

      class="botao whatsapp"

    <footer>
      NFC Conecta Brasil

  </div>

</body>
