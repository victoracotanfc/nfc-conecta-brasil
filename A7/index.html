<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Clínica Instituto Materno</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f5f5;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 420px;
      background: #ffffff;
      padding: 35px 25px;
      border-radius: 18px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.10);
      text-align: center;
    }

    h1 {
      font-size: 25px;
      color: #222222;
      margin-bottom: 30px;
    }

    .button {
      display: block;
      width: 100%;
      padding: 17px;
      margin: 14px 0;
      border-radius: 12px;
      text-decoration: none;
      font-size: 18px;
      font-weight: bold;
      color: #ffffff;
      transition: transform 0.2s ease, opacity 0.2s ease;
    }

    .button:active {
      transform: scale(0.98);
    }

    .whatsapp {
      background-color: #25D366;
    }

    .instagram {
      background: linear-gradient(
        45deg,
        #feda75,
        #fa7e1e,
        #d62976,
        #962fbf,
        #4f5bd5
      );
    }

    .google {
      background-color: #4285F4;
    }

    footer {
      margin-top: 30px;
      font-size: 14px;
      color: #888888;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>Clínica Instituto Materno</h1>

    <a
      class="button whatsapp"
      href="https://wa.me/5531999017212"
      target="_blank"
      rel="noopener noreferrer"
    >
      💬 WhatsApp
    </a>

    <a
      class="button instagram"
      href="https://www.instagram.com/instituto_materno?stkn=dTlqaWxxOTdva2Jw"
      target="_blank"
      rel="noopener noreferrer"
    >
      📸 Instagram
    </a>

    <a
      class="button google"
      href="https://search.google.com/local/writereview?placeid=ChIJDSQvKCO1pwARdNS5i8tpjAc"
      target="_blank"
      rel="noopener noreferrer"
    >
      ⭐ Avalie no Google
    </a>

    <footer>
      NFC Conecta Brasil
    </footer>

  </div>

</body>
</html>
